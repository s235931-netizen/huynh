name: Test REST API

on:
  workflow_dispatch:

jobs:
  test-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: server
        run: npm install

      - name: Start Backend
        working-directory: server
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          PORT: 5000
        run: |
          node server.js > server.log 2>&1 &
          sleep 8

      - name: Câu 40 - GET students
        run: |
          echo "GET /api/students"
          curl -i http://localhost:5000/api/students
      - name: Câu 41 - POST student
        run: |
          echo "POST /api/students"
          curl -i -X POST http://localhost:5000/api/students \
            -H "Content-Type: application/json" \
            -d '{"studentId":"SV002","name":"Nguyen Van C","email":"nguyenvanc@gmail.com"}'
